# 기본값은 stdio 전송이며, 이 설정은 프로파일과 무관하게 항상 적용된다.
#
# 왜 stdio 설정을 프로파일로 분리하지 않는가:
# stdio 전송은 stdout 을 MCP 프로토콜 채널로 쓴다. 배너나 콘솔 로그가 stdout 으로
# 새면 클라이언트의 JSON-RPC 파싱이 조용히 깨진다. 이 보호 설정을 stdio 프로파일에
# 넣어두면 SPRING_PROFILES_ACTIVE 에 다른 값(prod, dev 등)이 들어오는 순간 보호가
# 통째로 사라진다 — spring.profiles.default 는 활성 프로파일이 비어 있을 때만 적용되기
# 때문이다. 그래서 안전한 쪽을 무조건 적용하고, HTTP 로 갈 때만 application-http.yml 이
# 덮어쓴다. 모르는 프로파일이 와도 "깨진 하이브리드"가 아니라 정상 stdio 로 떨어진다.
spring:
  main:
    web-application-type: none
    banner-mode: "off"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  ai:
    mcp:
      server:
        name: toss-invest-mcp
        version: 0.1.0
        instructions: >-
          토스증권 공식 Open API(https://openapi.tossinvest.com) 기반 MCP 서버.
          공식 API만 사용합니다(비공식 WTS 미사용). 시세 조회 도구는 읽기 전용이고,
          주문 도구는 기본적으로 꺼져 있어 서버 설정 toss.trading.enabled=true 이면서
          호출에 execute=true 가 있어야만 실제로 전송됩니다. 그 밖에는 미리보기만 반환합니다.
          HTTP 전송(/mcp)에는 인증이 없습니다 — 실매매가 켜져 있다면 localhost 밖으로
          노출하지 마세요.
        stdio: true

toss:
  base-url: https://openapi.tossinvest.com
  client-id: ${TOSS_CLIENT_ID:}
  client-secret: ${TOSS_CLIENT_SECRET:}
  account: ${TOSS_ACCOUNT:}
  # 실매매 안전장치. 기본은 꺼짐이며, 켜더라도 아래 한도를 넘는 주문은 거부된다.
  trading:
    enabled: ${TOSS_TRADING_ENABLED:false}
    max-order-notional-krw: 100000
    max-order-notional-usd: 100
    daily-order-count: 20
    symbol-allowlist: []
  cache:
    l2:
      enabled: ${TOSS_CACHE_L2:false}

# stdout 은 프로토콜 전용이므로 콘솔 로그를 끄고 파일로만 남긴다.
logging:
  threshold:
    console: "OFF"
  file:
    name: ./logs/toss-mcp.log
