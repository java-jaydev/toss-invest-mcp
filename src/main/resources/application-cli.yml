# CLI 프로파일: 명령을 한 번 실행하고 종료한다. 이 프로파일에서는 MCP 서버(stdio·http
# 어느 쪽도)가 뜨지 않는다 — 명령 실행 결과만 stdout 에 쓴다.
#
# 이 파일이 실제로 바꾸는 값은 stdio 스위치 하나뿐이다. 나머지는 application.yml 의
# 기본값을 그대로 물려받는 것이 의도다:
# - spring.main.web-application-type: none → 그대로 둔다. CLI 도 웹서버가 필요 없다.
# - spring.main.banner-mode: off           → 그대로 둔다. 배너가 명령 출력(JSON 등) 앞에
#   섞이면 파이프(`./toss price 005930 | jq .`)가 깨진다.
# - logging.threshold.console: OFF         → 그대로 둔다. 로그(디버그·정보성 메시지)는
#   파일로만 남긴다. CommandLine 이 쓰는 System.out/PrintWriter 출력은 로깅 프레임워크를
#   거치지 않으므로 이 설정과 무관하게 항상 나간다 — 그래서 켤 필요가 없다.
spring:
  ai:
    mcp:
      server:
        stdio: false   # override: true — CLI 모드에서는 MCP 서버를 띄우지 않는다
