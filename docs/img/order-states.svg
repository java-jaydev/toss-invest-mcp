<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580"><rect width="1100" height="580" fill="#ffffff"/><defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0f172a"/></marker>
    <marker id="as" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b91c1c"/></marker>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1d4ed8"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#15803d"/></marker>
    <marker id="aw" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b45309"/></marker>
  </defs><text x="50" y="52" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start" letter-spacing="0">"No response" is not "no effect"</text><text x="50" y="78" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" fill="#64748b" font-weight="400" text-anchor="start" letter-spacing="0">Four outcomes an order tool can return — and the one most clients get wrong</text><line x1="50" y1="96" x2="1050" y2="96" stroke="#cbd5e1" stroke-width="1"/><circle cx="120" cy="270" r="9" fill="#0f172a"/><text x="120" y="300" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle" letter-spacing="0">order</text><text x="120" y="316" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle" letter-spacing="0">attempt</text><rect x="235" y="118" width="330" height="64" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/><text x="400" y="146" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" fill="#1d4ed8" font-weight="700" text-anchor="middle" letter-spacing="1">DRY_RUN</text><text x="400" y="167" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle" letter-spacing="0">gates closed — nothing sent</text><path d="M133,270 C210,270 210,150 232,150" fill="none" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#ap)"/><rect x="235" y="218" width="330" height="64" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/><text x="400" y="246" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" fill="#b91c1c" font-weight="700" text-anchor="middle" letter-spacing="1">REJECTED</text><text x="400" y="267" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle" letter-spacing="0">a guardrail or the broker refused</text><path d="M133,270 C210,270 210,250 232,250" fill="none" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#as)"/><rect x="235" y="318" width="330" height="64" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/><text x="400" y="346" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" fill="#15803d" font-weight="700" text-anchor="middle" letter-spacing="1">PLACED</text><text x="400" y="367" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle" letter-spacing="0">2xx received</text><path d="M133,270 C210,270 210,350 232,350" fill="none" stroke="#15803d" stroke-width="1.8" marker-end="url(#ag)"/><rect x="235" y="428" width="330" height="64" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/><text x="400" y="456" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" fill="#b45309" font-weight="700" text-anchor="middle" letter-spacing="1">UNKNOWN</text><text x="400" y="477" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle" letter-spacing="0">the request may or may not exist</text><path d="M133,270 C210,270 210,460 232,460" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#aw)"/><rect x="620" y="372" width="430" height="176" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/><text x="645" y="400" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" fill="#b45309" font-weight="700" text-anchor="start" letter-spacing="0">Never reported as success.</text><text x="645" y="421" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" fill="#b45309" font-weight="700" text-anchor="start" letter-spacing="0">Never reported as failure.</text><line x1="645" y1="437" x2="1025" y2="437" stroke="#b45309" stroke-width="1" opacity="0.4"/><text x="645" y="460" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="start" letter-spacing="0">The response carries its own recovery path:</text><text x="645" y="480" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="start" letter-spacing="0">retry with the same clientOrderId within</text><text x="645" y="500" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="start" letter-spacing="0">10 minutes and get the same outcome —</text><text x="645" y="520" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="start" letter-spacing="0">without placing a second order.</text><line x1="568" y1="460" x2="612" y2="460" stroke="#b45309" stroke-width="1.8" marker-end="url(#aw)"/><rect x="620" y="130" width="430" height="212" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="645" y="160" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" fill="#0f172a" font-weight="700" text-anchor="start" letter-spacing="0">Why this matters</text><text x="645" y="188.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start" letter-spacing="0">A retried search returns the same page.</text><text x="645" y="203.5" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start" letter-spacing="0">A retried order buys the stock twice.</text><text x="645" y="219.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start" letter-spacing="0"></text><text x="645" y="234.5" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start" letter-spacing="0">Collapsing a timeout into "failed" is a lie when</text><text x="645" y="250.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start" letter-spacing="0">the write may have landed. The caller then</text><text x="645" y="265.5" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start" letter-spacing="0">retries blind — and one order becomes two.</text><text x="645" y="281.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start" letter-spacing="0"></text><text x="645" y="296.5" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start" letter-spacing="0">The idempotency key is returned even when the</text><text x="645" y="312.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start" letter-spacing="0">call fails. A key you cannot see is a key you</text><text x="645" y="327.5" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start" letter-spacing="0">cannot retry with.</text></svg>