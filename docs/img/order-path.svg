<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1180" viewBox="0 0 1100 1180"><rect width="1100" height="1180" fill="#ffffff"/><defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0f172a"/></marker>
    <marker id="as" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b91c1c"/></marker>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1d4ed8"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#15803d"/></marker>
    <marker id="aw" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b45309"/></marker>
  </defs><text x="50" y="52" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start" letter-spacing="0">How an order reaches the broker — and where it doesn't</text><text x="50" y="78" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" fill="#64748b" font-weight="400" text-anchor="start" letter-spacing="0">toss-invest-mcp  ·  every gate below is enforced in code and pinned by a named test</text><line x1="50" y1="96" x2="1050" y2="96" stroke="#cbd5e1" stroke-width="1"/><rect x="130" y="125" width="400" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="330" y="154.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" fill="#0f172a" font-weight="600" text-anchor="middle" letter-spacing="0">Agent calls place_order</text><line x1="330" y1="175" x2="330" y2="205" stroke="#0f172a" stroke-width="1.8" marker-end="url(#a)"/><rect x="130" y="207" width="400" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="330" y="238.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" fill="#0f172a" font-weight="600" text-anchor="middle" letter-spacing="0">Validate input</text><line x1="330" y1="261" x2="330" y2="291" stroke="#0f172a" stroke-width="1.8" marker-end="url(#a)"/><rect x="130" y="293" width="400" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="330" y="324.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" fill="#0f172a" font-weight="600" text-anchor="middle" letter-spacing="0">Estimate notional from a live quote</text><line x1="330" y1="347" x2="330" y2="377" stroke="#0f172a" stroke-width="1.8" marker-end="url(#a)"/><rect x="130" y="379" width="400" height="138" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="330" y="405" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" fill="#0f172a" font-weight="700" text-anchor="middle" letter-spacing="1.2">GUARDRAILS</text><text x="156" y="431" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="start" letter-spacing="0">· is the amount computable?</text><text x="156" y="448" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="start" letter-spacing="0">· is the currency known?</text><text x="156" y="465" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="start" letter-spacing="0">· under the per-order cap?</text><text x="156" y="482" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="start" letter-spacing="0">· under the daily count?</text><text x="156" y="499" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="start" letter-spacing="0">· symbol on the allowlist?</text><line x1="330" y1="519" x2="330" y2="549" stroke="#0f172a" stroke-width="1.8" marker-end="url(#a)"/><rect x="130" y="551" width="400" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="330" y="574" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" fill="#0f172a" font-weight="600" text-anchor="middle" letter-spacing="0">Kill switch</text><text x="330" y="592" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle" letter-spacing="0">toss.trading.enabled</text><line x1="330" y1="605" x2="330" y2="635" stroke="#0f172a" stroke-width="1.8" marker-end="url(#a)"/><rect x="130" y="637" width="400" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="330" y="660" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" fill="#0f172a" font-weight="600" text-anchor="middle" letter-spacing="0">execute flag</text><text x="330" y="678" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle" letter-spacing="0">set on this specific call</text><line x1="330" y1="691" x2="330" y2="721" stroke="#0f172a" stroke-width="1.8" marker-end="url(#a)"/><rect x="130" y="723" width="400" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="330" y="746" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" fill="#0f172a" font-weight="600" text-anchor="middle" letter-spacing="0">Rate limit</text><text x="330" y="764" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle" letter-spacing="0">6/s  ·  3/s during 09:00–09:10 KST</text><line x1="330" y1="777" x2="330" y2="807" stroke="#0f172a" stroke-width="1.8" marker-end="url(#a)"/><rect x="130" y="809" width="400" height="52" rx="8" fill="#fffdf5" stroke="#fcd34d" stroke-width="1.5"/><text x="330" y="832" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" fill="#0f172a" font-weight="600" text-anchor="middle" letter-spacing="0">Increment the daily counter</text><text x="330" y="850" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle" letter-spacing="0">before the request, not after</text><line x1="330" y1="863" x2="330" y2="893" stroke="#0f172a" stroke-width="1.8" marker-end="url(#a)"/><rect x="130" y="895" width="400" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="330" y="924.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" fill="#0f172a" font-weight="600" text-anchor="middle" letter-spacing="0">POST order  +  clientOrderId</text><rect x="640" y="207" width="410" height="52" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/><text x="845" y="232" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" fill="#b91c1c" font-weight="700" text-anchor="middle" letter-spacing="1">REJECTED</text><text x="845" y="253" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle" letter-spacing="0">bad side, quantity, or price</text><line x1="534" y1="233" x2="632" y2="233" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#as)"/><rect x="640" y="379" width="410" height="138" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/><text x="845" y="404" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" fill="#b91c1c" font-weight="700" text-anchor="middle" letter-spacing="1">REJECTED</text><text x="845" y="425" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle" letter-spacing="0">an amount we cannot compute is not</text><text x="845" y="441" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle" letter-spacing="0">"no limit" — it is "the limit is</text><text x="845" y="457" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle" letter-spacing="0">unverifiable", so we stop.</text><text x="845" y="473" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle" letter-spacing="0"></text><text x="845" y="489" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle" letter-spacing="0">This fires in dry-run mode too.</text><line x1="534" y1="448.0" x2="632" y2="448.0" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#as)"/><rect x="640" y="551" width="410" height="138" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/><text x="845" y="576" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" fill="#1d4ed8" font-weight="700" text-anchor="middle" letter-spacing="1">DRY_RUN</text><text x="845" y="599" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle" letter-spacing="0">Shows exactly what would happen.</text><text x="845" y="616" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle" letter-spacing="0">Nothing is transmitted.</text><text x="845" y="633" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle" letter-spacing="0">Both switches must be open.</text><line x1="534" y1="577" x2="632" y2="577" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#ap)"/><line x1="534" y1="663" x2="632" y2="663" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#ap)"/><rect x="640" y="723" width="410" height="52" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/><text x="845" y="748" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" fill="#b91c1c" font-weight="700" text-anchor="middle" letter-spacing="1">REJECTED</text><text x="845" y="769" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle" letter-spacing="0">immediately — never sleeps inside the call</text><line x1="534" y1="749" x2="632" y2="749" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#as)"/><line x1="330" y1="945" x2="330" y2="977" stroke="#0f172a" stroke-width="1.8" marker-end="none"/><line x1="200" y1="977" x2="900" y2="977" stroke="#0f172a" stroke-width="1.8"/><line x1="200" y1="977" x2="200" y2="995" stroke="#0f172a" stroke-width="1.8" marker-end="url(#a)"/><rect x="50" y="999" width="300" height="66" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/><text x="200" y="1026" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" fill="#15803d" font-weight="700" text-anchor="middle" letter-spacing="1">PLACED</text><text x="200" y="1047" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle" letter-spacing="0">2xx received</text><line x1="550" y1="977" x2="550" y2="995" stroke="#0f172a" stroke-width="1.8" marker-end="url(#a)"/><rect x="400" y="999" width="300" height="66" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/><text x="550" y="1026" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" fill="#b91c1c" font-weight="700" text-anchor="middle" letter-spacing="1">REJECTED</text><text x="550" y="1047" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle" letter-spacing="0">broker refused (4xx / 5xx)</text><line x1="900" y1="977" x2="900" y2="995" stroke="#0f172a" stroke-width="1.8" marker-end="url(#a)"/><rect x="750" y="999" width="300" height="66" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/><text x="900" y="1026" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" fill="#b45309" font-weight="700" text-anchor="middle" letter-spacing="1">UNKNOWN</text><text x="900" y="1047" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle" letter-spacing="0">no response came back</text><rect x="50" y="1095" width="1000" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="72" y="1121" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" fill="#0f172a" font-weight="700" text-anchor="start" letter-spacing="0">Guardrails are evaluated BEFORE the kill switch.</text><text x="72" y="1142" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="start" letter-spacing="0">If the switch short-circuited first, an order that breaks your limits would still render as "here is what would happen" — the preview would lie by omission.</text></svg>