plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.jaydev'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:1.1.8"
    }
}

dependencies {
    // MCP server — 한 아티팩트로 stdio·Streamable HTTP 두 전송을 모두 서비스한다.
    // webmvc 스타터가 stdio 오토컨피그(-common)를 전이 의존으로 품으므로 스타터 병기 불필요.
    // 전송 선택은 Spring 프로파일(stdio / http)로 가른다.
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-json'
    // L1 near-cache (single-flight via Caffeine AsyncCache; loader runs off the monitor)
    implementation 'com.github.ben-manes.caffeine:caffeine'
    // L2 shared cache
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // 관측성: Micrometer 계측 + /actuator/prometheus 노출 (버전은 Boot BOM 관리)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // 주문 경로는 계좌 헤더가 실제로 실려 나가는지까지 확인해야 해서 HTTP 수준으로 검증한다.
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
}

tasks.named('test') {
    useJUnitPlatform()
    // 어떤 테스트가 실제로 돌고 무엇이 스킵됐는지 CI 로그에 남긴다.
    // RedisL2CacheIT 는 Docker 없는 환경에서 self-skip 하므로, 초록불만으로는 실행 여부를 알 수 없다.
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}
